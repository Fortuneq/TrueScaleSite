server {
    listen 80;
    server_name true-scale.ru www.true-scale.ru;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
    
    # API proxy for backend
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # CSS файлы
    location ~* \.css$ {
        root /usr/share/nginx/html;
        add_header Content-Type "text/css";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    
    # JS файлы
    location ~* \.js$ {
        root /usr/share/nginx/html;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    
    # Остальные статические файлы
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

# HTTPS конфигурация
server {
    listen 443 ssl;
    server_name true-scale.ru www.true-scale.ru;
    
    ssl_certificate /etc/letsencrypt/live/true-scale.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/true-scale.ru/privkey.pem;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    # N8N proxy
    location /n8n/ {
        proxy_pass http://172.17.0.1:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        
        # Remove /n8n prefix when forwarding to n8n
        rewrite ^/n8n/(.*)$ /$1 break;
    }

    # API proxy for backend
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # CSS файлы
    location ~* \.css$ {
        root /usr/share/nginx/html;
        add_header Content-Type "text/css";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    
    # JS файлы
    location ~* \.js$ {
        root /usr/share/nginx/html;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    
    # Остальные статические файлы
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}