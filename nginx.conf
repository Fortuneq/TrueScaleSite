server {
    listen 80;
    server_name true-scale.ru www.true-scale.ru;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # CSS файлы
    location ~* \.css$ {
        root /usr/share/nginx/html;
        add_header Content-Type "text/css";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    
    # JS файлы
    location ~* \.js$ {
        root /usr/share/nginx/html;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    
    # Остальные статические файлы
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

# HTTPS конфигурация
server {
    listen 443 ssl;
    server_name true-scale.ru www.true-scale.ru;
    
    ssl_certificate /etc/letsencrypt/live/true-scale.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/true-scale.ru/privkey.pem;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    location / {
        root /usr/share/nginx/html;
