<!-- CURSOR ANIMATION: Custom cursor animation wrapper -->
<!-- Creates a custom animated cursor that follows mouse movement -->
<div class="cursor-wrapper">
  <div style="transform: translate3d(40.713vw, -50vh, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(135deg) skew(0deg, 0deg); transform-style: preserve-3d; background-color: rgba(0, 0, 0, 0);" 
       class="cursor-2">
  </div>
</div>
