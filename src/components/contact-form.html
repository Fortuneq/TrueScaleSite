<!-- CONTACT FORM MODAL: Collaboration request form with Telegram integration -->
<section style="display:none" class="contact-form">
  
  <!-- Back Button -->
  <a data-w-id="9d929bee-b8e4-64d7-2db2-45ef09d73bc6" 
     style="opacity: 0;" 
     href="##" 
     class="back-button w-inline-block">
    <div>&lt; Back</div>
  </a>
  
  <!-- Form Container -->
  <div style="opacity: 0;" class="contact-form-holder">
    
    <!-- Form Title -->
    <h2 class="form-heading headline-system">Давайте создадим что-то великое</h2>
    
    <!-- Form Wrapper -->
    <div class="w-form">
      
      <!-- Main Contact Form -->
      <form id="wf-form-order-form" 
            name="wf-form-order-form" 
            class="form-2" 
            aria-label="order-form">
        
        <!-- Name Field -->
        <div class="form-field">
          <label for="name" class="body-system contact-form-field-label">Меня зовут</label>
          <input class="text-filed-contact-form w-input" 
                 maxlength="256" 
                 name="name" 
                 data-name="Name" 
                 placeholder="имя и фамилия" 
                 type="text" 
                 id="name" 
                 required="">
        </div>
        
        <!-- Company Field -->
        <div class="form-field">
          <label for="company" class="body-system contact-form-field-label">и я работаю в</label>
          <input class="text-filed-contact-form w-input" 
                 maxlength="256" 
                 name="company" 
                 data-name="company" 
                 placeholder="компания" 
                 type="text" 
                 id="company" 
                 required="">
        </div>
        
        <!-- Service Field -->
        <div class="form-field">
          <label for="service" class="body-system contact-form-field-label">Мне нужна помощь с</label>
          <input class="text-filed-contact-form w-input" 
                 maxlength="256" 
                 name="service" 
                 data-name="service" 
                 placeholder="автоматизация, ИИ-решения, аналитика и т.д." 
                 type="text" 
                 id="service" 
                 required="">
        </div>
        
        <!-- Phone Field -->
        <div class="form-field">
          <label for="phone" class="body-system contact-form-field-label">Связаться можно по</label>
          <input class="text-filed-contact-form w-input" 
                 maxlength="256" 
                 name="phone" 
                 data-name="phone" 
                 placeholder="мобильный телефон" 
                 type="tel" 
                 id="phone" 
                 required="">
        </div>
        
        <!-- Email Field -->
        <div class="form-field">
          <label for="email" class="body-system contact-form-field-label">Или по почте</label>
          <input class="text-filed-contact-form w-input" 
                 maxlength="256" 
                 name="email" 
                 data-name="email" 
                 placeholder="электронная почта" 
                 type="email" 
                 id="email" 
                 required="">
        </div>
        
        <!-- Submit Button -->
        <div class="submit-button-container">
          <input type="submit" 
                 data-wait="Please wait..." 
                 data-w-id="a2c5761e-9516-a64b-528d-25284d7b4b38" 
                 class="submit-button-2 w-button" 
                 value="Отправить">
        </div>
        
      </form>
      
      <!-- Success Message -->
      <div class="success-message w-form-done" 
           tabindex="-1" 
           role="region" 
           aria-label="order-form success">
        <div class="text-block-4">Thank you! Your submission has been received!</div>
      </div>
      
      <!-- Error Message -->
      <div class="w-form-fail" 
           tabindex="-1" 
           role="region" 
           aria-label="order-form failure">
        <div>Oops! Something went wrong while submitting the form.</div>
      </div>
      
    </div>
  </div>
  
  <!-- Form Animation Blocks -->
  <div style="width: 0%;" class="pink-block-anim-left"></div>
  <div style="width: 0%;" class="black-block-anim-left"></div>
  <div style="width: 0%;" class="pink-block-anim-right"></div>
  <div style="width: 0%;" class="black-block-anim-right"></div>
  
</section>
