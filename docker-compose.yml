version: '3.8'

services:
  truescale-site:
    build: .
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    container_name: truescale-site
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/letsencrypt
      - ./src/.well-known:/var/www/certbot/.well-known
    
    # Настройки для production
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./src:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email vladvolkov.work@gmail.com --agree-tos --no-eff-email -d true-scale.ru -d www.true-scale.ru
    depends_on:
      - truescale-site